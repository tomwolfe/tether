# Mission: dogfood-40-cleanroom-killrate-closure (v2)
# Findings: v1 proved the payload verification fully green (kill rate 0.92,
# all commands passed on every attempt) but failed on process: the payload
# had been pre-committed, so the captured change vs checkpoint was empty and
# the required review gate correctly rejected "no work exists" four times.
# Session forensics then surfaced a genuine Tether defect: with the real
# opencode reviewer, _parse_review_verdict missed escape-prefixed verdict
# lines entirely and recorded reason "\x1b[0m" when color-reset noise
# followed a bare marker — starving recovery of actionable feedback.
# V2 delivers that fix as real uncommitted work; three failing acceptance
# tests are ALREADY COMMITTED in tests/test_review_gate.py (red suite).
mission:
  name: dogfood-40-cleanroom-killrate-closure
  goal: |
    Make the review-verdict parser robust against ANSI-styled reviewer
    output, turning the three failing acceptance tests in
    tests/test_review_gate.py (section "verdict parsing vs ANSI reviewer
    output") green WITHOUT changing behavior for clean output, and keep
    every other check passing. All work stays UNCOMMITTED in the working
    tree — tether captures `git diff --binary <checkpoint HEAD>` plus the
    untracked listing, so committed work is invisible to review.

    TASK 1 - ANSI-ROBUST VERDICT PARSE (src/tether/orchestrator.py):
    In _verdict_lines/_parse_review_verdict: strip ANSI escape sequences
    from reviewer logs BEFORE scanning so an escape-prefixed marker line
    still decides; extract the reason from the decisive line's remainder
    after the verdict token when it carries substance (e.g. "REVIEW:
    REQUEST_CHANGES — patch.diff is empty"), otherwise walk forward past
    blank/escape-only lines to the first substantive line. The fail-safe
    contract is unchanged: only lines STARTING with a verdict marker count,
    the LAST such line decides, no marker => request_changes with the same
    diagnostic string. Do not touch any other orchestrator behavior.

    TASK 2 - DOCS TRUTH:
    Update docs/ARCHITECTURE.md step-12 review-gate text (and only that
    text) to state that verdict scanning strips ANSI escapes first and how
    the reason is extracted. Pin the amended claim in
    tests/test_docs.py alongside the existing pins.

    TASK 3 - RECORD THE OUTCOME:
    Append one short paragraph to the dogfood-40 section of
    docs/DOGFOODING.md recording that v2 landed the defect-5 fix.

constraints:
  - "only src/tether/orchestrator.py, docs/ARCHITECTURE.md, docs/DOGFOODING.md, tests/test_review_gate.py, tests/test_docs.py may be modified"
  - "the three committed ANSI acceptance tests must pass without editing their assertions"
  - "clean-output parsing stays byte-compatible (see the unchanged-semantics test)"
  - "no new third-party dependencies (stdlib only)"
  - "all work remains uncommitted in the working tree until tether reports success"

context_files:
  - src/tether/orchestrator.py
  - tests/test_review_gate.py
  - docs/ARCHITECTURE.md

verification:
  commands:
    - "python -m pytest -q"
    - "ruff check src tests tools"
    - "mypy src/tether"
    - ".venv/bin/tether adapters conformance mock"
    # Regression guard from v1: the quantitative strength gate holds while
    # the parser changes land.
    - ".venv/bin/python tools/mutation_killrate.py --target src/tether/cleanroom.py --suite tests/test_cleanroom.py --min-kill-rate 0.8"
  artifacts:
    - "src/tether/orchestrator.py"
  assertions:
    - path: src/tether/orchestrator.py
      contains: ansi
    - path: docs/ARCHITECTURE.md
      contains: "ANSI"
  probes:
    - command: ".venv/bin/python -m pytest -q tests/test_review_gate.py"
      contains: passed

recovery:
  max_attempts: 4
  strategy: cumulative

review:
  enabled: true
  required: true
  adapter: opencode
  retry_on_rejection: true
  context: full

budget:
  max_sends: 10
  max_wall_seconds: 10800

adapter: opencode
adapters:
  opencode:
    command: ["opencode", "run", "-m", "opencode/x-preview-f-free", "{prompt}"]
    timeout_seconds: 2700

allowed_paths:
  - src/tether/orchestrator.py
  - tests/test_review_gate.py
  - tests/test_docs.py
  - docs/**
  - missions/dogfood-40-cleanroom-killrate-closure.yaml

forbidden_paths:
  - .git/**
  - .tether/**
