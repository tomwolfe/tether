mission:
  name: aurelius-tasks-final-proof
  goal: |
    FINAL proof run for ProjectAurelius Tasks 1-6. The science tree is frozen and operator-verified green (see tether sext_closeout_evidence.md operator section 2026-11-20: pytest 675, ALL TOLERANCES MET, QED 3007 jobs, verify PASS, leakage CLEAN, evidence failures []). What remains: a fresh in-gate MUTATION kill_rate proof on the final tree plus REVIEW approve. Prior agent runs manufactured evidence (recycled other sessions' gate strings, deliberate dirtying); that is why review kept rejecting. This run must be irreproachable.
    HARD RULES (violation fails the mission):
    - NO edits to ProjectAurelius src, benchmarks logic, scripts logic, tests, Lean files, or tether verification/evidence scripts. The ONLY writable files are regenerated evidence artifacts (benchmarks/results/*.json+md via running the benchmark commands, tether sext_*.json/md via running the collector). NEVER hand-edit a number into an evidence file; every figure must come from a command you ran in-gate.
    - NEVER quote gate results from another session (cc443a2a, 687766f6, dec79b98, 23dd8056, operator runs). Quote ONLY this session's in-gate outputs, with exit codes.
    - NEVER dirty the tree deliberately to satisfy a check. Regenerate evidence by running the commands; commit per repo changed.
    - Review request MUST paste verbatim output tails (at least 5 lines each) for: pytest summary, benchmark CI REGRESSION GATES section, QED build line, verify tail, leakage line, evidence failures line, mutation summary. A review request without these tails is incomplete; do not send it.
    STEPS: run full verification in-gate; run mutation; regenerate evidence docs from in-gate outputs only (record THIS session id, kill rates, JSON paths, commit hashes); commit per repo; obtain review APPROVE with verbatim tails; leave all trees clean. Do not touch VeriTrial, DRIFT, Emergentia. ASCII hyphens only. Never use mock adapter. Every send including review uses opencode with model opencode-go/muse-spark-1.3-contributor via /Users/tom/Documents/apps/tether/scripts/opencode_tty.py PTY wrapper.
constraints:
  - FREEZE - no edits to src, benchmarks logic, scripts logic, tests, Lean, or tether tool scripts. Regenerated evidence artifacts only, from commands run in-gate.
  - NEVER quote another session's results as this session's. Verbatim tails plus exit codes only.
  - NEVER dirty the tree deliberately. Commit in the repo changed only, one repo per commit, leave trees clean.
  - Minimal changes. ASCII hyphens only in prompts.
  - Never use mock adapter. Adapter for every send including review must be opencode with model opencode-go/muse-spark-1.3-contributor.
git_state_guard: false
verification:
  clean_room: true
  clean_room_copy: [../QED, ../VeriTrial, ../DRIFT, ../Emergentia, ../ProjectAurelius]
  commands:
    - python3 tools/run_in_repo.py ../ProjectAurelius python3 -m pytest -q
    - python3 tools/run_in_repo.py ../ProjectAurelius python3 benchmarks/benchmark_unified.py
    - python3 tools/run_in_repo.py ../QED lake build
    - python3 ../ProjectAurelius/scripts/export_aurelius_to_qed.py --out /tmp/aurelius_lemmas.txt --lean-out ../QED/AureliusExport.lean
    - python3 tools/run_in_repo.py ../ProjectAurelius python3 scripts/verify_aurelius_qed.py
    - python3 -c "import re,pathlib; src=''.join(p.read_text() for p in list(pathlib.Path('../ProjectAurelius/src').rglob('*.py'))+list(pathlib.Path('../ProjectAurelius/scripts').rglob('*.py'))+list(pathlib.Path('../ProjectAurelius/benchmarks').rglob('*.py'))); bad=[m for m in re.findall(r'zai|glm-4|ZAI_API|socket|requests|urllib',src,re.I)]; assert not bad, bad; print('NETWORK_LEAKAGE_SCAN CLEAN')"
    - python3 tools/collect_sext_repo_evidence.py
  probes:
    - command: python3 tools/collect_sext_repo_evidence.py
      contains: SEXT EVIDENCE OK
  timeout_seconds: 3600
  mutation:
    enabled: true
    fail_below: 1.0
    max_mutants: 6
    baseline_targets:
      - ../ProjectAurelius/src/aurelius/scoring/oracle/reduction.py
      - ../ProjectAurelius/src/aurelius/scoring/oracle/delta_correction.py
      - ../ProjectAurelius/scripts/export_aurelius_to_qed.py
  auto_probes: {enabled: false}
review:
  enabled: true
  required: true
  adapter: opencode
  retry_on_rejection: true
recovery: {max_attempts: 2}
budget: {max_wall_seconds: 36000, max_sends: 30}
adapter: opencode
adapters:
  opencode:
    command: [python3, /Users/tom/Documents/apps/tether/scripts/opencode_tty.py, opencode-go/muse-spark-1.3-contributor, '{prompt}']
    timeout_seconds: 5400
allowed_paths: ['**']
forbidden_paths: [.git/**, .tether/**]
sandbox: []
