# Mission dogfood-44: quantitative verification gates hardening
# Target 1: the auto-probe tier's quantitative knobs must actually BIND.
# They sat under `adapters.opencode`, where the adapter layer warns
# "unknown setting" and nothing reads them: the generated-probe tier reads
# `verification.auto_probes.*`, so max_probes/max_mutants were inert and the
# teeth rate was never enforced. They are moved to the field that reads them.
# Target 2: the synthesis parser is all-or-nothing and fails on real-model
# single-quote nesting, so teeth = 0; the fix makes it salvage valid entries.
# The inert `adapters.mutation` block is gone with it: `adapters.<name>` is a
# free-form mapping for the ADAPTER, so its `enabled`/`fail_below`/`max_mutants`
# were never read by anything. The mutation gate this mission can afford is
# the mutation_killrate COMMAND above (it measures the declared battery
# against real mutants and fails the attempt below 0.8). A `verification.
# mutation` tier would re-run that whole battery once per mutant -- 12
# mutants per changed .py file against a 60-minute wall budget -- so it is
# not enabled here.
#
# WHAT THE PARSER DOES NOW (src/tether/autoprobes.py), all of it per-entry:
# a malformed entry costs only itself, and a response with no valid probe at
# all still FAILS (empty or missing fence, empty list, every entry
# malformed), so the mission falls back to its human-authored battery.
#   - The two scalar repairs COMPOSE: a chunk with a double-quoted casualty
#     AND a single-quoted casualty is read only when both of them run.
#   - A double-quoted scalar keeps the two escapes a shell fragment needs
#     (an escaped double quote and an escaped backslash); every other
#     backslash is data and survives verbatim.
#   - A `#` inside a quoted scalar is data, not the start of a comment, and
#     a trailing comment survives the repair.
#   - The SHAPE is forgiven when the entries themselves are sound: a tab
#     used for indentation (YAML forbids it), a key whose colon lacks its
#     blank (YAML then reads the line as one plain scalar), a bare list of
#     entries, and a capitalized `Probes:` key.
#   - An entry indented DEEPER than its siblings (a tab, or one stray space
#     too many) does not cost the siblings behind it: a shallower item
#     marker re-anchors the list body instead of ending the scan, so the
#     healthy entries behind the deep one are still read.
#   - A bulk reading that LOST an entry is re-read per entry. `command:'x'`
#     is one plain scalar to YAML, so the bulk reading holds the entry as
#     a string and drops it -- and a healthy sibling kept the valid set
#     non-empty, so the entry was never read at all. The second reading
#     wins only when it finds MORE probes; the bulk reading stands when it
#     does not, so the CONTENT is never forgiven.
#   - The CONTENT is not: an entry that fails the spec gate is still
#     dropped, and a placeholder probe is still never executed.
# NOT changed on purpose: the LAST fenced yaml block still wins (an earlier
# block is a draft, and the architecture doc pins that rule), and a
# non-string `contains` is still rejected rather than coerced.
#
# THE PROBE BATTERY BELOW pins every clause of the goal and both rejections
# the constraints name, so the mission's own behavioral verification says
# what the change claims: one malformed entry costs only itself
# (`salvaged:1`), a double-quoted scalar holding a shell fragment survives
# verbatim (`dq-ok`), the single-quote casualty the goal names is repaired
# (`sq-ok`), a deeper-indented entry does not cost the siblings behind it
# (`indent-ok`), an entry whose key colon lacks its blank is repaired
# beside a healthy sibling (`shape-ok`), and a response with no valid probe
# at all -- empty valid set, or no fence -- still fails (`zero-ok`).
#
# DOC DRIFT, recorded rather than quietly fixed: docs/ARCHITECTURE.md's
# parser paragraph and docs/DOGFOODING.md's earlier parser paragraph still
# say that ANY malformation rejects the whole response. That was true
# before this change and is false after it, so those two sentences are
# stale. (DOGFOODING.md's later dogfood-44 section already describes the
# per-entry salvage correctly, and ARCHITECTURE.md never mentions it at
# all.) Both files are outside `allowed_paths`, so the fix belongs to a
# follow-up mission, not to this one.
mission:
  name: dogfood-44-quantitative-gates
  goal: |
    Harden auto_probes synthesis parser to salvage valid probes when some entries are malformed.
    Currently parse_generated_probes rejects the whole response if any probe entry is invalid
    (e.g. single-quote YAML nesting from shell-style commands). Change to per-entry salvage:
    skip invalid entries, keep valid ones; only fail if zero valid probes remain. Also ensure
    double-quoted scalars handle shell fragments correctly. Keep all tests green.

    DO NOT CREATE ANY GIT COMMITS. Leave every change in the working tree,
    uncommitted. This mission runs with git_state_guard: true, and that guard
    compares the repo HEAD against a checkpoint taken at session start, so a
    commit made during the session is reported as "history was rewritten" and
    the mission fails with verification skipped -- even though the work itself
    is correct and the tests pass. The guard is strict on purpose
    (test_enabled_agent_commit_forward_trips_guard_strictness pins that
    semantics), so the fix is to not commit, not to weaken the guard.

constraints:
  - "only src/tether/autoprobes.py, tests/test_autoprobes.py, missions/dogfood-44-quantitative-gates.yaml may be modified"
  - "parse_generated_probes must still reject empty/missing fence and empty valid set"

verification:
  commands:
    - "python -m pytest -q"
    - "ruff check --no-cache src tests tools"
    - "mypy src/tether"
    - ".venv/bin/python tools/mutation_killrate.py --target src/tether/cleanroom.py --suite tests/test_cleanroom.py --min-kill-rate 0.8"
  probes:
    - command: ".venv/bin/python -c \"from tether.autoprobes import parse_generated_probes; r='''\n\\`\\`\\`yaml\nprobes:\n  - command: \\\"echo hi\\\"\n    contains: \\\"hi\\\"\n  - command: \\\"\\\"\n    contains: \\\"x\\\"\n\\`\\`\\`'''; specs=parse_generated_probes(r); print('salvaged:'+str(len(specs)))\""
      contains: "salvaged:1"
    - command: ".venv/bin/python -c \"from tether.autoprobes import parse_generated_probes\nr = r\\\"\\\"\\\"```yaml\nprobes:\n  - command: \\\"grep '\\\\d+' f\\\"\n    contains: \\\"x\\\"\n  - command: \\\"\\\"\n    contains: \\\"y\\\"\n```\\\"\\\"\\\"\nspecs = parse_generated_probes(r)\nwant = r\\\"grep '\\\\d+' f\\\"\ngot = [s.command for s in specs]\nprint(\\\"dq-ok\\\" if got == [want] else \\\"dq-bad:\\\" + repr(got))\""
      contains: "dq-ok"
    - command: ".venv/bin/python -c \"from tether.autoprobes import parse_generated_probes\nr = r\\\"\\\"\\\"```yaml\nprobes:\n  - command: 'python -c 'print(1)''\n    contains: '1'\n  - command: ''\n    contains: 'x'\n```\\\"\\\"\\\"\nspecs = parse_generated_probes(r)\nwant = \\\"python -c 'print(1)'\\\"\ngot = [s.command for s in specs]\nprint(\\\"sq-ok\\\" if got == [want] else \\\"sq-bad:\\\" + repr(got))\""
      contains: "sq-ok"
    - command: ".venv/bin/python -c \"from tether.autoprobes import parse_generated_probes, ProbeSynthesisError\ndef rejects(text):\n    try:\n        parse_generated_probes(text)\n    except ProbeSynthesisError:\n        return True\n    return False\nempty_set = r\\\"\\\"\\\"```yaml\nprobes:\n  - command: \\\"\\\"\n    contains: \\\"x\\\"\n```\\\"\\\"\\\"\nno_fence = \\\"probes:\\\\n  - command: \\\\\\\"echo hi\\\\\\\"\\\\n    contains: \\\\\\\"hi\\\\\\\"\\\\n\\\"\nprint(\\\"zero-ok\\\" if rejects(empty_set) and rejects(no_fence) else \\\"zero-bad\\\")\""
      contains: "zero-ok"
    - command: ".venv/bin/python -c \"from tether.autoprobes import parse_generated_probes\nr = r\\\"\\\"\\\"```yaml\nprobes:\n\t- command: 'echo A'\n\t  contains: 'A'\n  - command: 'echo B'\n    contains: 'B'\n  - command: 'echo C'\n    contains: 'C'\n```\\\"\\\"\\\"\nspecs = parse_generated_probes(r)\ngot = [s.command for s in specs]\nwant = ['echo A', 'echo B', 'echo C']\nprint(\\\"indent-ok\\\" if got == want else \\\"indent-bad:\\\" + repr(got))\""
      contains: "indent-ok"
    - command: ".venv/bin/python -c \"from tether.autoprobes import parse_generated_probes\nr = r\\\"\\\"\\\"```yaml\nprobes:\n  - command:'echo a'\n    contains:'a'\n  - command: 'echo b'\n    contains: 'b'\n```\\\"\\\"\\\"\nspecs = parse_generated_probes(r)\ngot = [s.command for s in specs]\nwant = ['echo a', 'echo b']\nprint(\\\"shape-ok\\\" if got == want else \\\"shape-bad:\\\" + repr(got))\""
      contains: "shape-ok"
  auto_probes:
    enabled: true
    # The `--adapter` CLI override only replaces the top-level agent adapter;
    # auto_probes.adapter is a separate field and stayed on `mock`, so the
    # synthesized-probe tier silently ran against the fake adapter and failed
    # with "no fenced yaml block found". Pin the real model here.
    adapter: opencode
    # These two are the caps the generated-probe tier actually applies. They
    # used to live under `adapters.opencode`, which is a free-form settings
    # mapping for the ADAPTER: the adapter layer warns "unknown setting" for
    # them and the tier never saw them, so they were inert.
    max_probes: 5
    max_mutants: 12
    # min_teeth_rate stays UNSET (advisory) on purpose, and the number it
    # would have to clear is recorded here rather than guessed:
    #   - measured against this very change, with the real synthesizer, the
    #     generated probes kill 4 of 20 mutants of the changed files -- 20%
    #     teeth, not 70%. The changed test file is a mutation target too, and
    #     its mutants are invisible to behavioral probes, which caps the rate
    #     before the probes' own reach is counted.
    #   - a binding rate of 0.7 (or even dogfood-43's 0.5) would therefore
    #     fail this mission on the SYNTHESIZER's probe quality, not on the
    #     change -- a failed attempt burns a recovery round for a number no
    #     edit of the parser can move.
    # The binding quantitative gate for this mission is the mutation_killrate
    # command above: it measures the declared battery against real mutants
    # and fails the attempt below 0.8.
    min_teeth_rate: null
adapters:
  opencode:
    command: ["opencode", "run", "--auto", "-m", "opencode/minimax-m3.1-flash-free", "{prompt}"]
    timeout_seconds: 2700

recovery:
  max_attempts: 3
  strategy: cumulative
review:
  enabled: false
budget:
  max_sends: 8
  max_wall_seconds: 3600
git_state_guard: true
adapter: opencode
allowed_paths:
  - src/tether/autoprobes.py
  - tests/test_autoprobes.py
  - missions/dogfood-44-quantitative-gates.yaml
forbidden_paths:
  - .git/**
  - .tether/**
