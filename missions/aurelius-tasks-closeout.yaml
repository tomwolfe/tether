mission:
  name: aurelius-tasks-closeout
  goal: |
    Close remaining ProjectAurelius gaps from session 17f935dd. Work in small verifiable steps, commit IN THE REPO CHANGED ONLY, one repo per commit, leave trees clean. Never use mock adapter. Every send including review uses opencode with model opencode-go/muse-spark-1.3-contributor via /Users/tom/Documents/apps/tether/scripts/opencode_tty.py PTY wrapper. ASCII hyphens only.
    STARTING STATE: ProjectAurelius HEAD has Tasks 1-2-4 commits plus dirty in-progress files (benchmarks/results/speed_baseline.json, speed_baseline.md, src/aurelius/agent/loop.py, src/aurelius/scoring/oracle/delta_correction.py, and a .coverage junk file that must be deleted, never committed). Adopt or rework the dirty files as appropriate, delete the .coverage file.
    GAP 1: tests/test_philosophy_verification.py::TestSoftwareSimplicity::test_cyclomatic_complexity fails - a function in core modules exceeds complexity 12. Refactor the offending function (extract helpers, no behavior change), keep scores identical. Do not weaken the test.
    GAP 2: collect_sext_repo_evidence.py demands mixtures valid >7 but benchmark_unified produced Tested 7 Valid 7. Add real mixture test coverage (more mixture cases through the same pipeline) so valid >7 genuinely. Do not lower the script threshold.
    GAP 3: reconcile novel_scaffold bar - benchmark_unified.py gate says 0.8 (fraction) while prior evidence describes 76.2% as passing. Confirm the code compares fraction-to-fraction consistently (min across seeds [42,123,7,2024,99] >= 0.8), document the reconciliation in evidence. Do not lower any bar.
    THEN: run FULL pytest, benchmark_unified (ALL TOLERANCES MET), QED lake build, export script, verify_aurelius_qed, leakage scan, mutation kill_rate 1.0 on reduction.py + delta_correction.py + export_aurelius_to_qed.py, review APPROVE. Update GLOBAL_MINIMUM_REPORT style evidence + SYSTEM_STATE equivalents with session IDs, kill rates, benchmark JSON paths, commit hashes. Leave every repo tree clean. Do not touch VeriTrial, DRIFT, Emergentia. Preserve QED Fin6, no sorry, pinned axioms.
constraints:
  - Commit in the repo you changed only, one repo per commit, leave trees clean. Never commit across repos.
  - Do not weaken verification commands, loosen asserts, or delete tests to go green.
  - Do not introduce sorry, sorryAx, or admits in any Lean file.
  - Do not add network, socket, requests, urllib, ZAI, or GLM code.
  - Minimal root-cause fixes only. ASCII hyphens only in prompts.
  - Never use mock adapter. Adapter for every send including review must be opencode with model opencode-go/muse-spark-1.3-contributor.
git_state_guard: false
verification:
  clean_room: true
  clean_room_copy: [../QED, ../VeriTrial, ../DRIFT, ../Emergentia, ../ProjectAurelius]
  commands:
    - python3 tools/run_in_repo.py ../ProjectAurelius python3 -m pytest -q
    - python3 tools/run_in_repo.py ../ProjectAurelius python3 benchmarks/benchmark_unified.py
    - python3 tools/run_in_repo.py ../QED lake build
    - python3 ../ProjectAurelius/scripts/export_aurelius_to_qed.py --out /tmp/aurelius_lemmas.txt --lean-out ../QED/AureliusExport.lean
    - python3 tools/run_in_repo.py ../ProjectAurelius python3 scripts/verify_aurelius_qed.py
    - python3 -c "import re,pathlib; src=''.join(p.read_text() for p in list(pathlib.Path('../ProjectAurelius/src').rglob('*.py'))+list(pathlib.Path('../ProjectAurelius/scripts').rglob('*.py'))+list(pathlib.Path('../ProjectAurelius/benchmarks').rglob('*.py'))); bad=[m for m in re.findall(r'zai|glm-4|ZAI_API|socket|requests|urllib',src,re.I)]; assert not bad, bad; print('NETWORK_LEAKAGE_SCAN CLEAN')"
    - python3 tools/collect_sext_repo_evidence.py
  probes:
    - command: python3 tools/collect_sext_repo_evidence.py
      contains: SEXT EVIDENCE OK
  timeout_seconds: 3600
  mutation:
    enabled: true
    fail_below: 1.0
    max_mutants: 6
    baseline_targets:
      - ../ProjectAurelius/src/aurelius/scoring/oracle/reduction.py
      - ../ProjectAurelius/src/aurelius/scoring/oracle/delta_correction.py
      - ../ProjectAurelius/scripts/export_aurelius_to_qed.py
  auto_probes: {enabled: false}
review:
  enabled: true
  required: true
  adapter: opencode
  retry_on_rejection: true
recovery: {max_attempts: 2}
budget: {max_wall_seconds: 36000, max_sends: 30}
adapter: opencode
adapters:
  opencode:
    command: [python3, /Users/tom/Documents/apps/tether/scripts/opencode_tty.py, opencode-go/muse-spark-1.3-contributor, '{prompt}']
    timeout_seconds: 5400
allowed_paths: ['**']
forbidden_paths: [.git/**, .tether/**]
sandbox: []
