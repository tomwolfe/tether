# Mission: veritrial-physiology-credibility
#
# Fail-closed physiology credibility: probes that the PBPK reference
# physiology is physiological on BOTH networks. Fin6 t1/2 ~42h is inside
# 20-80h; Fin14 t1/2 ~637h FAILS and must be fixed in code, not in this file.

mission:
  name: veritrial-physiology-credibility
  goal: |
    Prove the PBPK reference physiology credible on both Fin6 and Fin14:
    elimination t1/2 within 20-80h on BOTH networks, apparent Vd within
    0.5x-2x of typical_v_f, central Q >2.0 L/h, sum of perfused Q equal to
    CO*0.85 within +/-10%, Kp anchoring scaling within [0.2,5].

tasks:
  - Probe t1/2 20-80h on Fin6 and Fin14 (warfarin)
  - Probe Vd apparent within 0.5x-2x typical_v_f
  - Probe central Q >2.0 L/h and sum(Q_perfused) == CO*0.85 +/-10%
  - Probe Kp anchoring scaling in [0.2,5]

context_files:
  - src/insilico_trial/pbpk/model.py
  - src/insilico_trial/trial/engine.py
  - configs/drug_warfarin.yaml

verification:
  clean_room: true
  clean_room_copy:
    - "../QED"
    - "../DRIFT"
  workspace_repos:
    - "../QED"
    - "../DRIFT"
  commands:
    - >-
      env PYTHONPATH=src python3 -c "import sys; sys.path.insert(0,'src');
      from insilico_trial.pbpk.model import _reference_physiology, organ_indices, DEFAULT_ORGAN_NETWORK, STANDARD_14_ORGAN_NETWORK;
      print('physiology import ok')"
    - "env PYTHONPATH=src python3 -m pytest src/insilico_trial/tests/test_physiology_credibility.py -q -p no:cacheprovider"
    # Solver teeth: the credibility probes alone cannot kill ODE/dt mutants
    # (e.g. the saturable-branch condition, the 0.9x Metzler margin), so the
    # suites that pin those constructs run here too.
    - "env PYTHONPATH=src python3 -m pytest src/insilico_trial/tests/test_fixed_step.py src/insilico_trial/tests/test_solvers.py -q -p no:cacheprovider"
    # Measured-values command (NOT a probe: probe results record pass/fail
    # only, while command stdout tails reach the reviewer -- and the reviewer
    # must see the actual T12/Vd/Q/Kp numbers, not dot counts). Prints every
    # criterion value for both networks, then asserts fail-closed.
    - >-
      env PYTHONPATH=src python3 -c "import sys; sys.path.insert(0,'src');
      from insilico_trial.tests.test_physiology_credibility import T12_FIN6, T12_FIN14, _reference_adult_pk, _network_physiology;
      from insilico_trial.pbpk.model import DEFAULT_ORGAN_NETWORK, STANDARD_14_ORGAN_NETWORK;
      from insilico_trial.schemas import load_drug_config;
      drug = load_drug_config('configs/drug_warfarin.yaml');
      print('measured T12_FIN6=%.2f T12_FIN14=%.2f' % (T12_FIN6, T12_FIN14));
      assert 20<=T12_FIN6<=80 and 20<=T12_FIN14<=80;
      [print('measured %s half_life=%.2f vz_f=%.2f' % (l, pk['half_life'], pk['vz_f'])) or True for l, pk in (('Fin6', _reference_adult_pk(DEFAULT_ORGAN_NETWORK)), ('Fin14', _reference_adult_pk(STANDARD_14_ORGAN_NETWORK)))];
      [print('measured %s q_central=%.1f q_perf=%.1f kp_scale=%.3f' % (l, ph['q_central'], ph['q_perf'], ph['kp_scale'])) or True for l, ph in (('Fin6', _network_physiology(DEFAULT_ORGAN_NETWORK)), ('Fin14', _network_physiology(STANDARD_14_ORGAN_NETWORK)))];
      print('physiology values pinned')"
  timeout_seconds: 3600
  mutation:
    enabled: true
    fail_below: 0.8
    max_mutants: 6
    baseline_targets:
      - "src/insilico_trial/pbpk/model.py"
      - "src/insilico_trial/tests/test_physiology_credibility.py"
    # Documented equivalents (proven, not suppressed blindly; line drift
    # fails closed by missing the match and running the mutant):
    # - test_physiology_credibility.py:59:11 `dose = 10.0 * bioavailability`:
    #   the single dose variable feeds both the gut seed and the NCA dose, so
    #   `*`->`/` rescales both consistently. NCA half-life is shape-invariant
    #   and Vz/F = Dose/(AUC*lambda_z) is dose-proportional: the rescaling
    #   cancels exactly (up to float rounding far below every assertion).
    # - test_physiology_credibility.py:196:11 (same shape in the
    #   linear-predictor agreement test): the PBPK ODE is linear in dose, so a
    #   consistent rescaling of both solvers' inputs cancels in the relative
    #   agreement ratio exactly.
    equivalent:
      - "src/insilico_trial/tests/test_physiology_credibility.py:59:11"
      - "src/insilico_trial/tests/test_physiology_credibility.py:196:11"
  probes:
    - command: >-
        env PYTHONPATH=src python3 -c "import sys; sys.path.insert(0,'src');
        from insilico_trial.tests.test_physiology_credibility import T12_FIN6, T12_FIN14;
        print('measured T12_FIN6=%.2f T12_FIN14=%.2f' % (T12_FIN6, T12_FIN14));
        assert 20<=T12_FIN6<=80, T12_FIN6; assert 20<=T12_FIN14<=80, T12_FIN14;
        print('t12 pinned')"
      contains: "t12 pinned"

constraints:
  - "DO NOT create any git commits. Leave every change in the working tree, uncommitted."
  - "Do NOT edit docs to make gates pass. All fixes must be in code."
  - "Fin14 t1/2 ~637h is a FAIL; fix the physiology, not the probe"

git_state_guard: true

review:
  enabled: true
  required: true
  adapter: opencode
  retry_on_rejection: true

recovery:
  max_attempts: 1

budget:
  max_sends: 12
  max_wall_seconds: 10800
adapter: opencode

allowed_paths:
  - "**"
forbidden_paths:
  - ".git/**"
  - ".tether/**"
