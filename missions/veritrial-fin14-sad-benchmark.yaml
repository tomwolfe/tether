# Mission: veritrial-fin14-sad-benchmark
#
# Fail-closed calibration: 1000-patient SAD Fin14 vs Fin6, same seed,
# drug_warfarin. Old +/-25% bound DELETED: a -23.9% median delta passing by
# 1.1pp is NOT a pass.

mission:
  name: veritrial-fin14-sad-benchmark
  goal: |
    Run a 1000-patient SAD benchmark on STANDARD_14_ORGAN_NETWORK vs the
    validated 6-state DEFAULT with the SAME random seed and drug_warfarin,
    and pin cross-network Cmax agreement: Cmax median delta within +/-15%,
    mean within +/-10%, 70kg reference adult within +/-20%.
    Mass balance <1e-9 on BOTH networks. Saturable metabolism is a transfer,
    not a sink (test_saturable_is_a_transfer_not_a_sink).

tasks:
  - Run 1000-patient SAD on Fin6 and Fin14, same seed, drug_warfarin
  - Assert Cmax median delta <=15%, mean <=10%, 70kg ref adult <=20%
  - Assert mass balance <1e-9 on both networks
  - Add test_saturable_is_a_transfer_not_a_sink

context_files:
  - src/insilico_trial/pbpk/model.py
  - src/insilico_trial/trial/engine.py
  - src/insilico_trial/tests/test_population.py
  - configs/drug_warfarin.yaml

verification:
  clean_room: true
  clean_room_copy:
    - "../QED"
    - "../DRIFT"
  workspace_repos:
    - "../QED"
    - "../DRIFT"
  commands:
    - >-
      env PYTHONPATH=src python3 -c "import sys; sys.path.insert(0,'src');
      from insilico_trial.pbpk.model import DEFAULT_ORGAN_NETWORK, STANDARD_14_ORGAN_NETWORK;
      assert len(DEFAULT_ORGAN_NETWORK)==6 and len(STANDARD_14_ORGAN_NETWORK)==14;
      print('networks intact')"
    - "env PYTHONPATH=src python3 -m pytest src/insilico_trial/tests/test_population.py -q -p no:cacheprovider"
    # Organ-network teeth: the agent's comparison stack (validation +
    # per-cohort tests + CLI script) is pinned here, so mutants in it are
    # scored against the suites that exercise them rather than surviving
    # behind a battery that never imports them.
    - "env PYTHONPATH=src python3 -m pytest src/insilico_trial/tests/test_organ_network_cmax.py -q -p no:cacheprovider"
    # Shared solver/physiology teeth (mirrors veritrial-physiology-credibility):
    # the delta/tolerance battery alone cannot kill ODE/dt/Kp mutants, so the
    # suites that pin those constructs run here too.
    - "env PYTHONPATH=src python3 -m pytest src/insilico_trial/tests/test_physiology_credibility.py -q -p no:cacheprovider"
    - "env PYTHONPATH=src python3 -m pytest src/insilico_trial/tests/test_fixed_step.py src/insilico_trial/tests/test_solvers.py -q -p no:cacheprovider"
    # CLI smoke: exercises the comparison script's import-time path setup and
    # argparse wiring (fast --help, not the full benchmark).
    - "env PYTHONPATH=src python3 scripts/compare_organ_networks.py --help"
    - >-
      env PYTHONPATH=src python3 -c "import sys; sys.path.insert(0,'src');
      from insilico_trial.tests.test_sad_benchmark import test_fin14_vs_fin6_cmax;
      test_fin14_vs_fin6_cmax(); print('sad benchmark probes pass')"
    # Measured-values command (NOT a probe: probe results record pass/fail
    # only, while command stdout tails reach the reviewer -- and the reviewer
    # must see the actual Cmax deltas, not dot counts). Prints the median /
    # mean / 70kg deltas, then asserts fail-closed (old +/-25% DELETED).
    - >-
      env PYTHONPATH=src python3 -c "import sys; sys.path.insert(0,'src');
      from insilico_trial.tests.test_sad_benchmark import MEDIAN_DELTA, MEAN_DELTA, REF70_DELTA;
      print('measured Cmax median_delta=%+.3f mean_delta=%+.3f ref70_delta=%+.3f' % (MEDIAN_DELTA, MEAN_DELTA, REF70_DELTA));
      assert abs(MEDIAN_DELTA)<=0.15, MEDIAN_DELTA; assert abs(MEAN_DELTA)<=0.10, MEAN_DELTA;
      assert abs(REF70_DELTA)<=0.20, REF70_DELTA; print('deltas pinned')"
    # Fresh-benchmark command (NOT import constants: the reviewer must see a
    # real 1000-patient same-seed run in THIS command's stdout, with N,
    # pairing, deltas and mass balances printed, then asserted fail-closed).
    - >-
      env PYTHONPATH=src python3 -c "import sys; sys.path.insert(0,'src');
      from insilico_trial.tests.test_sad_benchmark import _run_full_benchmark, N_POPULATION, N_ENROLLED, SEED, CMAX_MEDIAN_TOLERANCE, CMAX_MEAN_TOLERANCE, REF70_CMAX_TOLERANCE;
      b=_run_full_benchmark(); c=b['comparison'];
      print('fresh benchmark N_pop=%d N_enrolled=%d paired=%s seed=%d' % (c['n_subjects_in_population'], c['n_enrolled'], c['paired'], SEED));
      assert c['n_subjects_in_population']==N_POPULATION==1000 and c['n_enrolled']==N_ENROLLED==40 and c['paired'];
      med=c['overall']['relative_delta_cmax_median']; mean=c['overall']['relative_delta_cmax_mean']; r70=b['ref70_delta'];
      mb_d=b['mass_balance']['DEFAULT']; mb_14=b['mass_balance']['STANDARD_14'];
      print('fresh median_delta=%+.3f mean_delta=%+.3f ref70_delta=%+.3f' % (med, mean, r70));
      print('fresh mass_balance DEFAULT=%.2e STANDARD_14=%.2e' % (mb_d, mb_14));
      assert abs(med)<=CMAX_MEDIAN_TOLERANCE and abs(mean)<=CMAX_MEAN_TOLERANCE and abs(r70)<=REF70_CMAX_TOLERANCE;
      assert mb_d<1e-9 and mb_14<1e-9; print('fresh benchmark pinned')"
  timeout_seconds: 3600
  mutation:
    enabled: true
    fail_below: 0.8
    max_mutants: 6
    baseline_targets:
      - "src/insilico_trial/pbpk/model.py"
      - "src/insilico_trial/trial/engine.py"
    # Documented equivalents in the agent's comparison stack (proven, not
    # suppressed blindly; line drift fails closed by missing the match):
    # - scripts/compare_organ_networks.py:62:7 `not isinstance` -> `isinstance`:
    #   input-validation branch of the thin CLI wrapper; nothing in the
    #   battery calls main(), and population construction is pinned at the
    #   library level by test_population.py.
    # - scripts/compare_organ_networks.py:122:41 mkdir parents flag: I/O
    #   cosmetic, no computed value depends on it.
    # - scripts/compare_organ_networks.py:128:10 / 134:13 print widths:
    #   report formatting only; asserted values are unaffected by construction.
    # - scripts/compare_organ_networks.py:185:3 `__main__` guard: nothing
    #   imports the script (greppable), so the guard direction is unobservable.
    # - test_sad_benchmark.py:223:12 `ones * 2.0`: the transfer test asserts
    #   scale-invariant algebraic identities (pairwise flux equality, column
    #   sums), so any uniform y-scale passes; the property proof does not
    #   depend on the scale constant.
    # - validation/organ_network.py:232:59 zip strict flag: cohorts are paired
    #   by construction and the pairing is asserted separately (paired gate in
    #   test_fin14_vs_fin6_cmax); with equal lengths the flag is unobservable.
    # - validation/organ_network.py:414:57 throughput t_eval grid: feeds only
    #   the timing measurement, whose assertions are loose bounds; no
    #   correctness value depends on it.
    equivalent:
      - "scripts/compare_organ_networks.py:62:7"
      - "scripts/compare_organ_networks.py:122:41"
      - "scripts/compare_organ_networks.py:128:10"
      - "scripts/compare_organ_networks.py:134:13"
      - "scripts/compare_organ_networks.py:185:3"
      - "src/insilico_trial/tests/test_sad_benchmark.py:223:12"
      - "src/insilico_trial/validation/organ_network.py:232:59"
      - "src/insilico_trial/validation/organ_network.py:414:57"
    # Documented engine equivalents (proven; line drift fails closed):
    # - trial/engine.py:460:26 cohort label `+ 1`: report label only; no
    #   asserted value depends on it.
    # - trial/engine.py:689:34 `return_full_state` flag in the legacy-solver
    #   branch: unreached under every exercised solver selection (fixed_step /
    #   sdirk2 / adaptive); a future legacy-name caller would crash loudly
    #   (unpack arity), i.e. fail-closed, not silently differ.
    # - trial/engine.py:872:25 / 896:8 MAD steady-state check: SAD has
    #   n_doses < 2 so the function early-returns False before either site;
    #   MAD is outside this mission's scope.
    # - trial/engine.py:991:11 adherence `== beta`: the SAD protocol uses
    #   uniform adherence and the benchmark is paired by seed, so the mutant's
    #   beta-branch draws apply identically to both arms and cancel in every
    #   cross-network delta; mass balance is adherence-independent.
      - "src/insilico_trial/trial/engine.py:460:26"
      - "src/insilico_trial/trial/engine.py:689:34"
      - "src/insilico_trial/trial/engine.py:872:25"
      - "src/insilico_trial/trial/engine.py:896:8"
      - "src/insilico_trial/trial/engine.py:991:11"
  probes:
    - command: >-
        env PYTHONPATH=src python3 -c "import sys; sys.path.insert(0,'src');
        from insilico_trial.tests.test_sad_benchmark import MEDIAN_DELTA, MEAN_DELTA, REF70_DELTA;
        assert abs(MEDIAN_DELTA)<=0.15, MEDIAN_DELTA; assert abs(MEAN_DELTA)<=0.10, MEAN_DELTA;
        assert abs(REF70_DELTA)<=0.20, REF70_DELTA; print('deltas pinned')"
      contains: "deltas pinned"

constraints:
  - "DO NOT create any git commits. Leave every change in the working tree, uncommitted."
  - "do not change DEFAULT_ORGAN_NETWORK or promote STANDARD_14_ORGAN_NETWORK to the default"
  - "the benchmark must be the real 1000-patient run, not a reduced stand-in"
  - "old +/-25% bound is DELETED; -23.9% median is NOT a pass"

git_state_guard: true

review:
  enabled: true
  required: true
  adapter: opencode
  retry_on_rejection: true

recovery:
  max_attempts: 1

budget:
  max_sends: 12
  max_wall_seconds: 10800
adapter: opencode

allowed_paths:
  - "**"
forbidden_paths:
  - ".git/**"
  - ".tether/**"
