mission:
  name: aurelius-global-closure-v6
  goal: |
    Close ProjectAurelius to an operational global minimum using Tether. Sequential phases, one gap at a time. Do not start the next phase until the current phase re-measures green. Source edits allowed only in ProjectAurelius, QED export code, and Tether mission or evidence code as needed by verification. If any phase fails, stop, report the failing command and root cause, do not proceed with broken measurement.
    Frozen bars below, phase order, verification commands, mutation config, review config, constraints define this mission. No prior numbers are proven. Measure everything fresh in-gate on committed trees.
    PREREQUISITE: the operator must commit the full tree before launch. The clean room stages committed trees. Do not launch on a tree with uncommitted fixes.
    FROZEN BARS (all must hold in the SAME clean-room run, on committed trees, with evidence regenerated in-gate; do not lower any bar; do not tune a bar to a measured value):
    - benchmark_unified.py prints ALL TOLERANCES MET.
    - Discovery: novel_scaffold_min 0.80, gated on MIN across seeds [42, 123, 7, 2024, 99]. Seeded-exact rediscovery >= 0.50. Score gap > 0. Duplicates in top-50 = 0. Trivial hits in top-50 = none. Min retrosynthetic depth top-10 > 1.
    - Oracle regression: LPM NIST rho >= 0.90, MAE <= 0.45. LPM unseen DFT rho >= 0.35. Dielectric verified rho >= 0.90, MAE <= 5.0, commercial MAE <= 3.0, max_err <= 50, p95_err <= 15. Viscosity rho >= 0.50. Donor rho >= 0.15 for transparency only. Donor number must NOT be in pipeline scoring.
    - Oracle aspirational: TOM LUMO unseen rho >= 0.30 and MAE <= 0.60, OR TOM LUMO is gated out of ranking with a fail-closed check, exactly like solution EA and donor number. Do not claim TOM LUMO is good because the regression bar is 0.05.
    - Solution EA: either a rank-preserving fit on MORE THAN 10 CV onsets with positive slope and positive Spearman rho, OR _EA_SOLUTION_CALIBRATION stays exactly (1.0, 0.0) and solution EA stays gated out of ranking. No silent use.
    - Closed-loop: suggester beats random AND random_top_k on delta-MAE AND delta-rho with p < 0.05, on scaffold-disjoint holdout, with permutation control. Sabotage (label-flip, shuffled, poisoned) must degrade held-out performance.
    - EA vs random: EA beats random AND random_top_k at budgets 20, 40, 60, p < 0.05, with gate_pass true in benchmark_ea_vs_random.py output.
    - Formal: QED lake build clean. ProjectAurelius/scripts/export_aurelius_to_qed.py regenerates QED/AureliusExport.lean. Zero sorry, zero sorryAx, zero admits in any Lean file. Axioms exactly [propext, Classical.choice, Quot.sound]. Existing 14 theorems preserved, plus one lemma plus one exporter pin at a time if new lemmas are added. QED core stays domain-agnostic: no chemistry vocabulary in parser or agentic_pipeline.
    - Mutation: enabled, fail_below 1.0, max_mutants 6 (see mutation config).
    - Review: enabled, required, adapter opencode, retry_on_rejection true.
    - Sandbox: []. NETWORK_LEAKAGE_SCAN clean: no zai, glm-4, ZAI_API, socket, requests, urllib in ProjectAurelius src, scripts, benchmarks.
    - Cross-repo: QED lake build, VeriTrial formal gate, Emergentia export gate, DRIFT headless check must stay green. Do not break other repos to fix Aurelius.
    - Performance: full DiscoveryLoop wall-clock at least 3x faster at fixed seeds and budgets for Tier 1 zero-change fixes, with bit-identical scores on the same seeds. Tier 2 batched fixes allowed only after Phase 5, proven by A/B at fixed seeds and budgets with no frozen-bar regression. A per-stage timing report is required evidence.
    PHASE ORDER:
    - Phase 0: Measure only. Record HEADs for all six repos (DRIFT, Emergentia, QED, tether, VeriTrial, ProjectAurelius). Run the full gate from committed trees. Report which old claims reproduce and which do not. No science edits. Add a timing harness for one full DiscoveryLoop run at fixed seeds and budgets. Record the baseline.
    - Phase 1: Measurement integrity. Audit every RNG on the discovery path: MutationEngine, DiscoveryLoop, selection, benchmarks. Thread the benchmark seed through all of them. Prove seeds diverge: per-seed screened SETS, score gaps, and novel-scaffold SETS and counts must differ, per-seed candidate overlap mean must be below 1 with a per-pair Jaccard table. Seeded-exact rediscovery is injection-recall by construction. Same-seed reruns must be bit-identical across processes (PYTHONHASHSEED sensitivity = fail: sort every BRICSDecompose iteration boundary). Regenerate unified_benchmark.json, ea_vs_random.json, validated_candidates.json in-gate. Fail closed if committed JSONs lack seeds_tested or predate the benchmark code. Accept whatever the true min is. If it is below 0.80, report the gap, do not tune the metric.
    - Phase 2: Performance Tier 1, zero-change only. Fixes allowed: delete the duplicate _record_scaffolds call in _record_results, incremental SMILES to best-score dict instead of scanning all_results per seed, memoized Murcko scaffold, fingerprint, synthesis depth, and grounding per canonical SMILES, one long-lived XTBSinglePointOracle per run with flush once per generation, append-only or SQLite xTB cache instead of full-file JSON dump per cold SP, precomputed index map instead of fps_list.index in selection, build seed-pool set once per batch, incremental depth stats and ranked seeds instead of full scans and sorts, cached GPR fingerprints and base predictions. Prove bit-identical scores on the same seeds. If any score changes, stop and root-cause it. Do not change selection, weights, bars, budgets, or seeds to buy speed.
    - Phase 3: Oracle. Fix TOM LUMO unseen, dielectric outliers, solution EA, donor transparency, in that order. TOM LUMO status: raw unseen rho 0.086, Delta-corrected unseen rho 0.071 (both far below 0.30; section-5 0.2744 is in-distribution) - the gate-out path is taken unless a new predictor meets the aspirational bar. Re-verify the negative control (re-opened weights must fail the gate), do not re-tune. Minimal root-cause fixes only. Do not restructure working code. Do not weaken tests. Do not lower bars.
    - Phase 4: Search global. Add multi-seed restarts and basin-hopping or iterated local search if not already active in the measured tree. Ablate tournament vs NSGA-II vs random_top_k on the same pool and budget. Keep BRICS guard, scaffold crowding, grounding penalty, novelty gate. Gate on min across seeds, not mean. Diagnose the absolute-score gap explicitly: EA top mean near 21 in prior evidence versus DISCOVERY_THRESHOLD 65.0. Show score decomposition for top candidates and for known good solvents under current weights. If the ceiling is structural in the scoring function, fix the model, do not run more search. Do not lower 65.0.
    - Phase 5: Closed-loop. Fix the suggester until it beats random AND random_top_k on delta-MAE and delta-rho with p < 0.05 on scaffold-disjoint holdout. Keep sabotage tests. If sabotage does not degrade performance, the test is vacuous: fix the test, do not delete it.
    - Phase 6: Performance Tier 2, bounded-change only. Fixes allowed: batched xTB escalation per generation reusing already-computed Tier-2 values, mixture component reuse from result_map instead of re-screening, batched oracle sub-steps, GPR refit only when new labelled points pass a threshold. Prove by A/B at fixed seeds and budgets: same Pareto set up to a reported bounded delta, no frozen-bar regression, mutation kill rate still 1.0. If any bar regresses, revert Tier 2 and keep Tier 1.
    - Phase 7: Formal. One lemma plus one exporter pin at a time. Rebuild QED, verify no sorry, verify axioms, repeat.
    - Phase 8: Deliverable. Regenerate validated_candidates.json from the unified pipeline with dedupe by canonical SMILES, trivial filter, depth > 1, recomputed scores. Replace binary mixture synergy with defined synergy: mixture property minus fraction-weighted sum of pure components.
    - Phase 9: Full gate in clean room. Stop on green. Report evidence, HEADs, per-seed table, timing table, remaining gaps. If any phase fails, stop, report the failing command and root cause, do not proceed with broken measurement.
workspace_repos:
  - ../QED
  - ../VeriTrial
  - ../DRIFT
  - ../Emergentia
  - ../ProjectAurelius
constraints:
  - Do not create git commits. Leave all changes uncommitted. git_state_guard is true.
  - Do not edit the mission mid-run.
  - Do not weaken verification commands, loosen asserts, or delete tests to go green.
  - Do not introduce sorry, sorryAx, or admits in any Lean file.
  - Do not add network, socket, requests, urllib, ZAI, or GLM code.
  - Do not change QED core to add domain vocabulary.
  - Do not claim a bar is met on an uncommitted tree. Gate counts only from clean room on committed trees with in-gate regenerated evidence.
  - Keep existing tests green. Keep cross-repo gates green.
  - Minimal root-cause fixes only. No restructuring working code.
  - No new test files unless a failing command requires a new pin.
  - "Budget: max_wall_seconds 36000, max_sends 30. Recovery max_attempts 2."
  - "Use ASCII hyphens only in prompts. No em dashes, no smart quotes, no ellipsis characters."
  - "Never use mock adapter. Adapter for every send including review must be opencode with model opencode-go/muse-spark-1.3-contributor."
git_state_guard: true
verification:
  clean_room: true
  clean_room_copy: [../QED, ../VeriTrial, ../DRIFT, ../Emergentia, ../ProjectAurelius]
  commands:
    - python3 tools/run_in_repo.py ../ProjectAurelius python3 -m pytest tests/test_philosophy_verification.py tests/test_delta_correction.py tests/test_wetlab_cycle.py tests/test_closed_loop_efficacy.py tests/test_v12_improvements.py tests/test_experimental_ingestion.py tests/test_label_confound.py tests/test_oracle_holdout.py -q
    - python3 tools/run_in_repo.py ../ProjectAurelius python3 benchmarks/benchmark_unified.py
    - python3 tools/run_in_repo.py ../ProjectAurelius python3 benchmarks/benchmark_ea_vs_random.py
    - python3 tools/run_in_repo.py ../QED lake build
    - python3 ../ProjectAurelius/scripts/export_aurelius_to_qed.py --out /tmp/aurelius_lemmas.txt --lean-out ../QED/AureliusExport.lean
    - python3 ../QED/verify_pbpk_lemmas.py /tmp/aurelius_lemmas.txt
    - python3 tools/run_in_repo.py ../ProjectAurelius python3 scripts/verify_aurelius_qed.py
    - python3 -c "import re,sys,pathlib; src=''.join(p.read_text() for p in list(pathlib.Path('../ProjectAurelius/src').rglob('*.py'))+list(pathlib.Path('../ProjectAurelius/scripts').rglob('*.py'))+list(pathlib.Path('../ProjectAurelius/benchmarks').rglob('*.py'))); bad=[m for m in re.findall(r'zai|glm-4|ZAI_API|socket|requests|urllib',src,re.I)]; assert not bad, bad; print('NETWORK_LEAKAGE_SCAN CLEAN')"
    - python3 tools/collect_sext_repo_evidence.py
  probes:
    - command: python3 tools/collect_sext_repo_evidence.py
      contains: SEXT EVIDENCE OK
    - command: python3 tools/run_in_repo.py ../ProjectAurelius python3 benchmarks/benchmark_ea_vs_random.py
      contains: Results written to
  timeout_seconds: 3600
  mutation:
    enabled: true
    fail_below: 1.0
    max_mutants: 6
    equivalent: [../ProjectAurelius/src/aurelius/agent/mutation/engine.py:350:12, ../ProjectAurelius/src/aurelius/agent/loop.py:1409:12, ../ProjectAurelius/benchmarks/benchmark_ea_vs_random.py:126:12]
    baseline_targets:
      - ../ProjectAurelius/src/aurelius/scoring/oracle/reduction.py
      - ../ProjectAurelius/src/aurelius/scoring/oracle/delta_correction.py
      - ../ProjectAurelius/scripts/export_aurelius_to_qed.py
      - ../ProjectAurelius/src/aurelius/pipeline.py
      - ../ProjectAurelius/src/aurelius/agent/selection.py
      - ../ProjectAurelius/src/aurelius/agent/mutation/engine.py
      - ../ProjectAurelius/src/aurelius/scoring/oracle/gc.py
  auto_probes: {enabled: false}
review:
  enabled: true
  required: true
  adapter: opencode
  retry_on_rejection: true
recovery: {max_attempts: 2}
budget: {max_wall_seconds: 36000, max_sends: 30}
adapter: opencode
adapters:
  opencode:
    command: [python3, scripts/opencode_tty.py, opencode-go/muse-spark-1.3-contributor, '{prompt}']
    timeout_seconds: 5400
allowed_paths: ['**']
forbidden_paths: [.git/**, .tether/**]
sandbox: []
