mission:
  name: sext-aurelius-global
  goal: |
    Achieve ProjectAurelius global minimum: close monotonic closed-loop gap, keep unified benchmark green, formal export verified, mutation kill_rate 1.0, review APPROVE, sandbox [].
    Bars:
        - benchmark_unified.py ALL TOLERANCES MET, novel_scaffold_min 0.75 across 5 seeds
        - test_v12_improvements::test_loop_shows_monotonic_improvement passes
        - test_closed_loop_efficacy sabotage dMAE <0
        - QED lake build clean, Aurelius export verifies no sorry, axioms pinned
        - mutation kill_rate 1.0 on reduction.py + delta_correction.py + export_aurelius_to_qed.py
        - NETWORK_LEAKAGE_SCAN clean
context:
    - "ProjectAurelius/src/aurelius/scoring/oracle/delta_correction.py: bounded RBF (0.5,5.0) warm-start, self-gating revert on length collapse"
    - "2026-11-07 status: pytest 117 passing (incl. 2 new BRICS-guard pins), benchmark ALL TOLERANCES MET (novel min 76.2% across 5 seeds), lake build clean, export verifies 4/4 no-sorry, verify_aurelius_qed 12/12, NETWORK_LEAKAGE_SCAN CLEAN, sext evidence OK with machine-checked axioms [propext, Classical.choice, Quot.sound]. Prior gate run: clean-room 6/6 green, mutation kill_rate 1.0 (29/29 effective +1 documented equivalent engine.py:350:12). Operator-measured with the gate-identical sampler/seed/operators/max6 (pytest-battery kill-checks, a conservative lower bound of the gate battery): reduction.py 6/6, delta_correction.py 6/6, test_philosophy 6/6, collector 6/6 killed, 0 survived; the 496 break_return mutant verified killed by the new guard tests. Preserve these; do not restructure working code or weaken tests to chase mutants."
    - "Prior review (request_changes) dispositions, all implemented: engine.py:496 suppression removed as unsound (guard reachable via BRICSDecompose-exception path) and replaced by direct guard tests; sorry scan recursive excluding vendored .lake (all tracked QED Lean sources are top-level); network scan is gate command 7; axiom values machine-checked in-gate by the evidence collector; reduction/delta carry doc-only contract comments so the changed-source sampler measures them."
    - "Change discipline: make NO source or test edits unless a verification command actually fails in the clean room. If one fails, fix the root cause minimally (no restructuring, no new test files, no loosened asserts, no touching delta_correction.py / engine.py / export_aurelius_to_qed.py / KillPins tests) and re-verify. Never edit to silence a gate."
    - "Model: opencode-go/muse-spark-1.3-contributor via scripts/opencode_tty.py PTY wrapper, never mock"
    - "Runs with --project-dir tether (control plane), clean-room copies all 5 sibling repos"
workspace_repos:
    - "../QED"
    - "../VeriTrial"
    - "../DRIFT"
    - "../Emergentia"
    - "../ProjectAurelius"
constraints:
    - "DO NOT create git commits. Leave changes uncommitted. git_state_guard true."
    - "Do not weaken verification commands"
    - "Do not introduce sorry"
    - "Keep existing tests green"
git_state_guard: true
sandbox_mode: enforce
verification:
  clean_room: true
  clean_room_copy: ["../QED", "../VeriTrial", "../DRIFT", "../Emergentia", "../ProjectAurelius"]
  commands:
        - "python3 tools/run_in_repo.py ../ProjectAurelius python3 -m pytest tests/test_philosophy_verification.py tests/test_delta_correction.py tests/test_wetlab_cycle.py tests/test_closed_loop_efficacy.py tests/test_v12_improvements.py -q"
        - "python3 tools/run_in_repo.py ../ProjectAurelius python3 benchmarks/benchmark_unified.py"
        - "python3 tools/run_in_repo.py ../QED lake build"
        - "python3 ../ProjectAurelius/scripts/export_aurelius_to_qed.py --out /tmp/aurelius_lemmas.txt --lean-out ../QED/AureliusExport.lean"
        - "python3 ../QED/verify_pbpk_lemmas.py /tmp/aurelius_lemmas.txt"
        - "python3 tools/run_in_repo.py ../ProjectAurelius python3 scripts/verify_aurelius_qed.py"
        - "python3 -c \"import re,sys,pathlib; src=''.join(p.read_text() for p in list(pathlib.Path('../ProjectAurelius/src').rglob('*.py'))+list(pathlib.Path('../ProjectAurelius/scripts').rglob('*.py'))+list(pathlib.Path('../ProjectAurelius/benchmarks').rglob('*.py'))); bad=[m for m in re.findall(r'zai|glm-4|ZAI_API|socket|requests|urllib',src,re.I)]; assert not bad, bad; print('NETWORK_LEAKAGE_SCAN CLEAN')\""
        - "python3 tools/collect_sext_repo_evidence.py"
  timeout_seconds: 3600
  mutation:
    enabled: true
    fail_below: 1.0
    max_mutants: 6
    # Documented-equivalent suppression (provably behavior-identical):
    # - engine.py:350:12: break_return rewrites `return expr` -> `return None`;
    #   the site already IS `return None`, so the mutant is byte-identical
    #   (modulo ast.unparse formatting) and no suite can kill it.
    # (The former `len(all_frags) < 2` guard entry was removed: the guard
    # and its no-valid-pairs siblings are now pinned by direct unit tests
    # in TestEngineMutationKillPins, so those mutants die honestly.)
    equivalent:
      - "../ProjectAurelius/src/aurelius/agent/mutation/engine.py:350:12"
    baseline_targets:
            - "../ProjectAurelius/src/aurelius/scoring/oracle/reduction.py"
            - "../ProjectAurelius/src/aurelius/scoring/oracle/delta_correction.py"
            - "../ProjectAurelius/scripts/export_aurelius_to_qed.py"
  auto_probes: {enabled: false}
review:
  enabled: true
  required: true
  adapter: opencode
  retry_on_rejection: true
recovery: {max_attempts: 2}
budget: {max_wall_seconds: 36000, max_sends: 30}
adapter: opencode
adapters:
  opencode:
    command: ["python3", "scripts/opencode_tty.py", "opencode-go/muse-spark-1.3-contributor", "{prompt}"]
    timeout_seconds: 5400
allowed_paths: ["**"]
forbidden_paths: [".git/**", ".tether/**"]
