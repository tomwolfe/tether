mission:
  name: veritrial-formal-gate
  goal: |
    Enforced formal-verification gate for the VeriTrial PBPK model.

    This mission closes the gap between "algebraic identity checking" and
    "formal ODE verification": it runs the VeriTrial -> QED semantic bridge to
    export parametric PBPK mass-conservation theorems (Metzler positivity,
    boundary inflow invariants, the parametric mass-conservation sum, and
    mass dissipation) and then forces every exported theorem through QED's
    agentic pipeline over [LinearOrderedField R] / [Field R] with Mathlib.
    The mission FAILS unless QED proves ALL theorems with no `sorry`.

    Concretely the gate:
      1. exports parametric theorems from the CURRENT PBPK source via
         VeriTrial/scripts/export_pbpk_to_qed.py (this also runs a structural
         mass-balance check and aborts if conservation is broken);
      2. verifies each theorem with QED/verify_pbpk_lemmas.py, which proves them
         with real Lean 4 tactics (positivity, field_simp, ring) under the
         strict no-sorry policy. Static numeric witnesses are banned: the
         bridge emits ONLY parametric theorems.

    Clean-room isolation ensures the bridge/lemma proofs are checked against a
    pristine checkout plus only this session's captured change, never against
    agent-planted working-tree helpers. Review is required and retries on
    rejection so the agent can repair a broken lemma or QED tactic policy.
context:
  - "VeriTrial PBPK model uses perfusion-limited ODEs (src/insilico_trial/pbpk/model.py)"
  - "State vector: [A_gut, A_liver, A_central, A_periph, A_effect, A_elim]"
  - "QED ODE tactic policy (agentic_pipeline.get_tactic_candidates) prioritizes positivity / field_simp / ring for parametric rate-of-change inputs"
  - "QED parser recognizes d<var>/dt = <rhs> ODEs (parser.is_ode / parse_ode / involves_derivative)"
  - "Semantic bridge: VeriTrial/scripts/export_pbpk_to_qed.py -> QED-parseable parametric theorems"
  - "Verifier: QED/verify_pbpk_lemmas.py (exits non-zero if ANY theorem fails, no sorry)"
  - "Parametric theorems over [LinearOrderedField R] / [Field R] prove via positivity / field_simp+ring with auto-generated positivity hypotheses"
  - "Static numeric witnesses (129 = 129, closed arithmetic sums, reflexive x = x) are banned from the bridge and fail the gate in --strict mode"
constraints:
  - "Do NOT modify Tether's core orchestration logic"
  - "Do NOT introduce sorry axioms in QED output; the no-sorry gate must remain strict"
  - "Keep all changes backward compatible with existing VeriTrial simulations"
  - "Every exported lemma MUST verify; a single failure fails the whole mission"
  - "Parametric export is the default (Mathlib-backed CI proves field_simp/ring goals hermetically)"
verification:
  # Clean-room: verify the bridge + lemmas against a pristine checkout plus
  # only this session's captured change. QED lives in a sibling repo; it is
  # located portably by scripts/verify_formal_gate.py (via $QED_DIR or a
  # sibling-of-repo fallback) -- NO machine-specific absolute paths are
  # hardcoded here. The sibling copy below materializes ../QED alongside the
  # clean-room checkout so the fallback resolves inside the clean room.
  clean_room: true
  clean_room_copy:
    - "../QED"
  commands:
    # 1) Generate fresh lemmas from the CURRENT PBPK source (also enforces the
    #    structural mass-balance invariant; exits non-zero if broken).
    #
    #    PYTHONPATH=src is load-bearing, exactly as in command 3: the host
    #    carries an editable install of insilico_trial pointing at the live
    #    VeriTrial checkout, so without it the bridge imports the HOST
    #    model.py and certifies sources that are not in this clean room.
    #
    #    --lean-out is load-bearing too. QED is materialized as a sibling of
    #    the room, so its VeriTrialExport.lean is whatever QED HEAD committed
    #    (currently the Fin 14 artifact). Emitting here makes the Lean file
    #    the gate compiles and axiom-checks the one derived from the same
    #    six-organ model as the lemma set below, instead of a stale export of
    #    a different organ network. Same shape as the tri-repo gate.
    - "env PYTHONPATH=src python3 scripts/export_pbpk_to_qed.py --lean-out ../QED/VeriTrialExport.lean --out /tmp/pbpk_lemmas.txt"
    # 2) Feed every generated lemma into QED through the portable gate runner,
    #    which fails the mission if ANY lemma cannot be verified (no sorry).
    #
    #    --fin-n is REQUIRED, not defaulted: the emitted lemma set is a
    #    function of the organ network (one Metzler and one inflow invariant
    #    per perfused tissue), so the gate refuses to certify a file against
    #    an assumed network. The export above uses the default six-organ
    #    network, hence 6. --strict is the fail-closed mode.
    - "env PYTHONPATH=src python3 scripts/verify_formal_gate.py /tmp/pbpk_lemmas.txt --fin-n 6 --strict"
    # 2b) Run the test suite that pins the bridge and the gate.
    #
    #     Without this the gate has no teeth over its own logic. Steps 1-2
    #     invoke the two scripts, so a mutation lands in a test file that
    #     nothing in this mission ever executes and survives at 100% -- the
    #     kill rate was reporting green on a gate that could not see its own
    #     regression. These are the tests that pin the lemma set, the
    #     per-tissue Metzler coverage and the fail-closed paths.
    #     PYTHONPATH=src / -p no:cacheprovider for the same reasons as
    #     command 3: the host editable install must not shadow the room's
    #     sources, and pytest must not write into the clean room.
    - "env PYTHONPATH=src python3 -m pytest src/insilico_trial/tests/test_bridge_mutation_fast.py src/insilico_trial/tests/test_formal_verification.py src/insilico_trial/tests/test_fixed_step.py -q -p no:cacheprovider"
    # 3) Mutation-teeth battery for the baseline_targets below.
    #
    # This command is the fix for a gate that reported kill rate 30% (12/40)
    # against its own 0.8 floor, and it is not a threshold problem. The two
    # commands above only ever OBSERVE the emitted theorem set, so a mutant
    # is killable only if it changes those nine strings. Measured through
    # this gate's own sampler (per-path seed, these three operators,
    # max_mutants 10 x 4 targets): 33 of the 40 sampled mutants leave the
    # export byte-identical, 5 crash it, and only 2 change what it emits.
    # The 33 sit in the saturable-flux detector, the Metzler/DILI and
    # mass-conservation guards, the Jacobian helper, the fixpoint expander
    # and the column-sum cross-check -- code the theorem set never exercises.
    # A suite that cannot see them reports them as SURVIVING while
    # certifying itself, which is the same "0.77 against a 0.8 floor, purely
    # from suite selection" defect the tri-repo gate fixed the same way.
    #
    # These are the suites that actually cover the four baseline_targets:
    # test_bridge_mutation_fast.py pins both gate scripts, test_pd.py pins
    # pd/__init__.py, test_fixed_step.py pins the pbpk/model.py Jacobian
    # against jax.jacfwd. Together they kill 33 of the 40 -- the run's score
    # goes 0.30 -> 0.825, measured, not projected, and nothing is suppressed
    # to buy it (no `equivalent:` entries, no lower floor, no dropped
    # target). They are pure-Python (~5 s), which matters because the
    # mutation battery re-runs this whole suite once per mutant;
    # test_formal_verification.py was left out for exactly that reason (it
    # drives real Lean: 2 m13 s per pass, ~90 min over the battery).
    #
    # PYTHONPATH=src is load-bearing, not boilerplate: the host carries an
    # editable install of insilico_trial, which would otherwise shadow the
    # clean room's own (possibly mutated) sources and make every mutant here
    # unkillable. -p no:cacheprovider keeps pytest from writing into the room.
    - "env PYTHONPATH=src python3 -m pytest src/insilico_trial/tests/test_bridge_mutation_fast.py src/insilico_trial/tests/test_pd.py src/insilico_trial/tests/test_fixed_step.py -q -p no:cacheprovider"
  assertions:
    # The formal spec must document the parametric mass-conservation identity.
    - path: "formal_specs/pbpk_mass_conservation.tex"
      contains: "Lemma 3c"
    # The formal spec must also document the boundary inflow invariant.
    - path: "formal_specs/pbpk_mass_conservation.tex"
      contains: "Lemma 4"
  probes:
    # PYTHONPATH=src on the probes for the same reason as on command 1: the
    # host's editable insilico_trial install would otherwise let these assert
    # against live sources rather than the clean room's copy.
    #
    # The exported theorem set must contain the Metzler positivity invariant.
    - command: "env PYTHONPATH=src python3 scripts/export_pbpk_to_qed.py"
      contains: "Q_liver / (V_liver * Kp_liver) > 0"
    # The exported theorem set must contain the mass dissipation inequality.
    - command: "env PYTHONPATH=src python3 scripts/export_pbpk_to_qed.py"
      contains: "CL * C_p > 0"
    # The exported theorem set must contain a boundary inflow invariant.
    - command: "env PYTHONPATH=src python3 scripts/export_pbpk_to_qed.py"
      contains: "(Q_liver / (V_central * Kp_liver)) * A_central >= 0"
    # The parametric sum uses compartment-specific symbolic rates.
    - command: "env PYTHONPATH=src python3 scripts/export_pbpk_to_qed.py"
      contains: "ka_rate"
    # The export bridge must emit exactly 9 parametric theorems, and -- more
    # to the point -- one Metzler certificate per perfused compartment. The
    # count alone is not the invariant: 7 was reachable with two of the three
    # Metzler lemmas dropped, because the gate's coverage check was a count
    # over a loose regex. Assert the certificates themselves, so a future
    # reduction cannot buy the count back by giving up coverage.
    - command: "env PYTHONPATH=src python3 -c \"import pathlib, subprocess; p = '/tmp/tether_pbpk_lemmas_probe.txt'; subprocess.run(['python3', 'scripts/export_pbpk_to_qed.py', '--out', p], check=True); print(len(pathlib.Path(p).read_text().splitlines()))\""
      matches: "^9$"
    - command: "env PYTHONPATH=src python3 -c \"import pathlib, re, sys; sys.path.insert(0, 'scripts'); import verify_formal_gate as g; lemmas = pathlib.Path('/tmp/tether_pbpk_lemmas_probe.txt').read_text().splitlines(); t = [x for x in (g._metzler_positivity_tissue(l) for l in lemmas) if x]; print(sorted(set(t))); assert len(t) == len(set(t)) == 3, f'expected one Metzler certificate per perfused tissue, got {t}'\""
      matches: "\\['effect', 'liver', 'periph'\\]"
  # High-stakes gate: mutation-test the change so the gate has real "teeth"
  # (a trivially-passing gate would be mutated to still pass -> fail_below).
  mutation:
    enabled: true
    operators:
      - negate_compare
      - flip_bool
      - arithmetic
    max_mutants: 10
    fail_below: 0.8
    # Scored by command 3 above, not by the export's theorem set: the two
    # export commands observe only the nine emitted strings, and 33 of the
    # 40 mutants these four targets yield leave those strings untouched. Do
    # not read a low score here as an equivalence claim about the code -- it
    # is a statement about which suite the mutation battery re-runs.
    # The gate's own logic and the tests that pin it. `baseline_targets` is
    # used when the session changes nothing mutatable, and when the agent
    # edits a file that is not listed here the runner mutates THAT file
    # instead -- so the test file has to be a target in its own right, or an
    # agent touching it is scored on mutants nothing in the mission runs.
    baseline_targets:
      - "scripts/export_pbpk_to_qed.py"
      - "scripts/verify_formal_gate.py"
      - "src/insilico_trial/pbpk/model.py"
      - "src/insilico_trial/pd/__init__.py"
      - "src/insilico_trial/tests/test_bridge_mutation_fast.py"
      - "src/insilico_trial/tests/test_formal_verification.py"
  recovery:
    max_attempts: 3
    strategy: cumulative
  review:
    enabled: true
    required: true
    adapter: opencode
    retry_on_rejection: true
  budget:
    max_sends: 20
    max_wall_seconds: 3600
  # High-stakes gate: refuse to run unless the working tree is clean (a dirty
  # tree would defeat the clean-room guarantee).
  git_state_guard: true
  adapter: opencode
  adapters:
    opencode:
      command: ["opencode", "run", "--auto", "-m", "opencode/space-bunny-free", "{prompt}"]
      timeout_seconds: 1800
