context: []
constraints: []
verification:
  commands:
  - python -m pytest -q
  - ruff check src tests
  - mypy src/tether
  - .venv/bin/tether adapters conformance mock
  timeout_seconds: 900
  artifacts:
  - README.md
  - docs/ARCHITECTURE.md
  - docs/ADAPTERS.md
recovery:
  max_attempts: 4
adapter: opencode
adapters:
  opencode:
    command:
    - opencode
    - run
    - -m
    - opencode/x-preview-f-free
    - '{prompt}'
    timeout_seconds: 1800
allowed_paths:
- src/**
- tests/**
- docs/**
- README.md
forbidden_paths:
- .git/**
- .tether/**
- missions/**
context_files: []
