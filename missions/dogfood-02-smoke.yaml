mission:
  name: dogfood-02-adapter-smoke
  goal: |
    Add a `tether adapters smoke <name>` command and prove it with tests.
    Tasks:
    1. In src/tether/cli.py (or a new src/tether/smoke.py used by cli), add
       `tether adapters smoke NAME [--prompt TEXT]` that: builds the adapter
       from project config, checks is_available(), then sends a trivial
       prompt (default "Reply with the single word OK") inside a temporary
       directory, printing availability, exit status, stdout/stderr excerpt,
       and elapsed time. Never touches the caller's git tree.
    2. Exit code 0 only if the adapter is available and the subprocess
       exits 0; non-zero otherwise with a clear message.
    3. Add tests in tests/test_adapters_cli.py using the mock adapter and a
       fake command adapter; assert output fields and exit codes via the
       CliRunner pattern already used in that file.
    4. Document the command in README.md under adapters.
    Change NOTHING outside this scope.
context:
  - See src/tether/adapters/command.py CommandAdapter.send for how prompts
    are dispatched to subprocesses; reuse its machinery where possible.
  - Follow existing CLI conventions in src/tether/cli.py (typer style).
constraints:
  - do not change adapter interfaces
  - all current tests must keep passing
verification:
  commands:
    - "python -m pytest -q"
    - "ruff check src tests"
    - "mypy src/tether"
  timeout_seconds: 600
recovery:
  max_attempts: 3
adapter: opencode
adapters:
  opencode:
    command: ["opencode", "run", "{prompt}"]
    timeout_seconds: 1800
