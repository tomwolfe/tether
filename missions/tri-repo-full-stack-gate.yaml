mission:
  name: tri-repo-full-stack-gate
  goal: |
    Verify integrated QED-VeriTrial-Tether stack in clean-room isolation.

    This mission orchestrates cross-repo verification across the three
    repositories that compose the regulatory-grade in-silico platform:

      1. QED: Lean 4 agentic theorem-proving pipeline (symbolic Real analysis)
      2. VeriTrial: PBPK clinical trial simulation engine (native JAX solver)
      3. Tether: Orchestration and verification control plane

    The gate runs the hardened full-stack checks:
      - AST<->Lean isomorphism export (VeriTrialExport.lean, proved by rfl)
      - Formal gate: every exported lemma verifies through QED (no sorry),
        including the lake-compiled isomorphism and #print axioms assertion
      - De-clamped fixed-step/SDIRK solvers under the dynamic Metzler dt bound
      - Merkle provenance chain (tether session + QED proofs + benchmarks)
context:
  - "QED lakefile.lean declares mathlib4 from leanprover-community/mathlib4"
  - "QED agentic_pipeline.py invokes the pinned toolchain's lean directly with an explicit LEAN_PATH (lake env is bypassed: it SIGTRAPs under this Lake/Lean combination)"
  - "QED Compartmental.lean: pbpk_is_metzler, pbpk_diag_nonpos/neg, mass dissipation"
  - "VeriTrial export_pbpk_to_qed.py --lean-out emits the AST<->Lean isomorphism file"
  - "VeriTrial formal_verification.py embeds SHA-256 hashes of verified Lean code"
  - "VeriTrial fixed_step.calculate_max_stable_dt derives the dt bound from matrix invariants"
  - "Cross-repo QED is located as sibling of VeriTrial (co-located monorepo layout)"
workspace_repos:
  - "../QED"
  - "../VeriTrial"
constraints:
  - "Do NOT introduce sorry axioms in any QED output"
  - "Do NOT modify existing test expectations without justification"
  - "Keep all changes backward compatible with existing simulations"
  - "Cross-repo orchestration via clean_room_copy with sibling repos"
  - "Every exported lemma MUST verify; a single failure fails the whole mission"
  - "No jnp.maximum concentration clamping; non-negativity via dt bound only"
git_state_guard: true
verification:
  clean_room: true
  clean_room_copy:
    - "../QED"
    - "../VeriTrial"
  mutation:
    enabled: true
    fail_below: 0.8
    max_mutants: 25
  commands:
    - "python3 ../VeriTrial/scripts/export_pbpk_to_qed.py --lean-out ../QED/VeriTrialExport.lean --out /tmp/pbpk_lemmas.txt"
    - "python3 ../VeriTrial/scripts/rebuild_qed_oleans.py"
    - "python3 ../VeriTrial/scripts/verify_formal_gate.py /tmp/pbpk_lemmas.txt"
    - "python3 -c \"import sys, os; os.chdir(os.path.join(os.getcwd(), '../VeriTrial')); sys.path.insert(0, 'src'); from insilico_trial.validation import run_all_validations, build_regulatory_provenance; run_all_validations(); build_regulatory_provenance()\""
  timeout_seconds: 3600
review:
  required: true
  retry_on_rejection: true
recovery:
  max_attempts: 1
adapter: opencode
adapters:
  opencode:
    command: ["opencode", "run", "-m", "opencode/muse-spark-1.3-contributor-free", "{prompt}"]
    timeout_seconds: 1800
