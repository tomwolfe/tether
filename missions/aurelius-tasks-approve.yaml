mission:
  name: aurelius-tasks-approve
  goal: |
    Evidence + review closure for ProjectAurelius Tasks 1-6. NO science code changes: src, benchmarks logic, scripts logic, and Lean files are FROZEN. Only evidence/report files may change (tether sext evidence JSONs/MDs, ProjectAurelius benchmark results JSONs/MDs regenerated in-gate, QED export artifacts regenerated in-gate).
    CONTEXT: session cc443a2a already green on every substantive gate - pytest 671 passed 2 skipped, benchmark_unified ALL TOLERANCES MET, QED lake build 3007 jobs, export verifies, verify_aurelius_qed all PASS, NETWORK_LEAKAGE_SCAN CLEAN, mutation kill_rate 1.0 (18/18 on reduction.py, delta_correction.py, export_aurelius_to_qed.py). The only failure was the review gate, whose reason is factually stale: it claims gate strings are unproven, but the session report contains them verbatim (pytest 671 passed, ALL TOLERANCES MET, SEXT failures []). Do NOT relitigate settled science. Do NOT weaken any bar.
    STEPS:
    1. Re-run the full verification suite in-gate (same commands as aurelius-tasks-closeout) to confirm green on the frozen tree. Quote these EXACT gate strings in the plan and in every review request: pytest "671 passed", benchmark "ALL TOLERANCES MET", "Build completed successfully", "NETWORK_LEAKAGE_SCAN CLEAN", evidence '"failures": []', mutation kill_rate 1.0.
    2. Update evidence docs with session cc443a2a IDs, kill rates, benchmark JSON paths, commit hashes: tether SEXT evidence (sext_repo_evidence.json, sext_system_state.json, sext_closeout_evidence.md, GLOBAL_MINIMUM_REPORT.md, SYSTEM_STATE.json as applicable) and ProjectAurelius benchmark results regenerated in-gate. Record the novel_scaffold reconciliation: benchmark gate novel_scaffold_min 0.8 is a FRACTION compared fraction-to-fraction against min across seeds [42,123,7,2024,99]; prior 76.2% was the same metric in percent on a single seed and does NOT pass the multi-seed bar. Record speed baseline vs batched-GPR throughput and score-identity (<=3e-6).
    3. Commit per repo changed, one repo per commit, leave trees clean. Then obtain review APPROVE: the review request MUST include the exact gate strings above plus the in-gate command exit codes, so the reviewer cannot claim tails show only warnings.
    4. Leave every repo tree clean. Do not touch VeriTrial, DRIFT, Emergentia. Preserve QED Fin6, no sorry, pinned axioms. ASCII hyphens only. Never use mock adapter. Every send including review uses opencode with model opencode-go/muse-spark-1.3-contributor via /Users/tom/Documents/apps/tether/scripts/opencode_tty.py PTY wrapper.
constraints:
  - SCIENCE FREEZE - no edits to ProjectAurelius src, benchmarks logic, scripts logic, tests, or any Lean file. Evidence/regenerated artifacts only.
  - Commit in the repo you changed only, one repo per commit, leave trees clean. Never leave uncommitted changes.
  - Do not weaken verification commands, loosen asserts, or delete tests to go green.
  - Minimal evidence-only changes. ASCII hyphens only in prompts.
  - Never use mock adapter. Adapter for every send including review must be opencode with model opencode-go/muse-spark-1.3-contributor.
git_state_guard: false
verification:
  clean_room: true
  clean_room_copy: [../QED, ../VeriTrial, ../DRIFT, ../Emergentia, ../ProjectAurelius]
  commands:
    - python3 tools/run_in_repo.py ../ProjectAurelius python3 -m pytest -q
    - python3 tools/run_in_repo.py ../ProjectAurelius python3 benchmarks/benchmark_unified.py
    - python3 tools/run_in_repo.py ../QED lake build
    - python3 ../ProjectAurelius/scripts/export_aurelius_to_qed.py --out /tmp/aurelius_lemmas.txt --lean-out ../QED/AureliusExport.lean
    - python3 tools/run_in_repo.py ../ProjectAurelius python3 scripts/verify_aurelius_qed.py
    - python3 -c "import re,pathlib; src=''.join(p.read_text() for p in list(pathlib.Path('../ProjectAurelius/src').rglob('*.py'))+list(pathlib.Path('../ProjectAurelius/scripts').rglob('*.py'))+list(pathlib.Path('../ProjectAurelius/benchmarks').rglob('*.py'))); bad=[m for m in re.findall(r'zai|glm-4|ZAI_API|socket|requests|urllib',src,re.I)]; assert not bad, bad; print('NETWORK_LEAKAGE_SCAN CLEAN')"
    - python3 tools/collect_sext_repo_evidence.py
  probes:
    - command: python3 tools/collect_sext_repo_evidence.py
      contains: SEXT EVIDENCE OK
  timeout_seconds: 3600
  mutation:
    enabled: true
    fail_below: 1.0
    max_mutants: 6
    baseline_targets:
      - ../ProjectAurelius/src/aurelius/scoring/oracle/reduction.py
      - ../ProjectAurelius/src/aurelius/scoring/oracle/delta_correction.py
      - ../ProjectAurelius/scripts/export_aurelius_to_qed.py
  auto_probes: {enabled: false}
review:
  enabled: true
  required: true
  adapter: opencode
  retry_on_rejection: true
recovery: {max_attempts: 2}
budget: {max_wall_seconds: 36000, max_sends: 30}
adapter: opencode
adapters:
  opencode:
    command: [python3, /Users/tom/Documents/apps/tether/scripts/opencode_tty.py, opencode-go/muse-spark-1.3-contributor, '{prompt}']
    timeout_seconds: 5400
allowed_paths: ['**']
forbidden_paths: [.git/**, .tether/**]
sandbox: []
